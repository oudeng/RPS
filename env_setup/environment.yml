name: rps310
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific stack
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.11
  - matplotlib>=3.7
  - seaborn>=0.12
  - tqdm>=4.64
  - websockets>=10.4
  - psutil>=5.9
  - joblib>=1.2
  # ML baselines used by RF/SVM/XGB agents
  - scikit-learn>=1.2
  - xgboost>=1.7
  # PyTorch (GPU build; if you want CPU-only, remove pytorch-cuda)
  - pytorch
  - pytorch-cuda=11.8
